name: navigation_vocale
description: SDK Flutter de navigation vocale mains-libres pour Thinkphone.
version: 2.0.0
homepage: https://github.com/sarahbm11/navigation-vocale-thinkphone-

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: ca.thinkphone.navigation_vocale
        pluginClass: NavigationVocalePlugin

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.0
  http: ^1.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
