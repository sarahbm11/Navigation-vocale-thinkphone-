name: navigation_vocale
description: SDK Flutter de navigation vocale pour Thinkphone — naviguez sans toucher l'écran.
version: 1.0.0
homepage: https://github.com/sarahbm11/navigation-vocale-thinkphone-

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: ca.thinkphone.navigation_vocale
        pluginClass: NavigationVocalePlugin

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.0
  flutter_overlay_window: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
