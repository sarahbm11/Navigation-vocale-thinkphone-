name: Build & Release APK

on:
  push:
    branches: [ main, master, claude/flutter-voice-navigation-sdk-zpxj4w ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Créer un projet Flutter propre (Android v2)
        run: |
          flutter create \
            --project-name navigation_vocale_app \
            --org ca.thinkphone \
            --platforms android \
            build_app

      - name: Injecter notre code Dart
        run: |
          # Remplace le code Dart par le nôtre
          rm -rf build_app/lib
          cp -r example/lib build_app/lib

          # Utilise notre pubspec — path: ../ pointe vers le SDK à la racine du dépôt
          cp example/pubspec.yaml build_app/pubspec.yaml

      - name: Patcher compileSdk à 36
        run: |
          GRADLE=build_app/android/app/build.gradle
          # flutter create génère compileSdk flutter.compileSdkVersion ou un nombre fixe
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' "$GRADLE" || true
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$GRADLE" || true
          sed -i 's/compileSdk [0-9]\+/compileSdk 36/' "$GRADLE" || true
          sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 36/' "$GRADLE" || true

      - name: Ajouter les permissions Android
        run: |
          MANIFEST=build_app/android/app/src/main/AndroidManifest.xml
          # Injecte les permissions avant <application
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"

      - name: Ajouter le service d'accessibilité au manifest
        run: |
          MANIFEST=build_app/android/app/src/main/AndroidManifest.xml
          # Copie la config XML du service
          mkdir -p build_app/android/app/src/main/res/xml
          cp android/src/main/res/xml/accessibility_service_config.xml \
             build_app/android/app/src/main/res/xml/

          # Injecte la déclaration du service avant </application>
          sed -i 's|</application>|        <service\n            android:name="ca.thinkphone.navigation_vocale.VoiceNavigationAccessibilityService"\n            android:exported="true"\n            android:label="Navigation Vocale Thinkphone"\n            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService" />\n            </intent-filter>\n            <meta-data\n                android:name="android.accessibilityservice"\n                android:resource="@xml/accessibility_service_config" />\n        </service>\n    </application>|' "$MANIFEST"

          # Ajoute la string de description manquante
          echo -e '<resources>\n    <string name="accessibility_service_description">Navigation Vocale — contrôlez votre Thinkphone par la voix. Aucune donnée enregistrée.</string>\n</resources>' \
            > build_app/android/app/src/main/res/values/accessibility_strings.xml

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK release
        working-directory: build_app
        run: flutter build apk --release --no-shrink --target-platform android-arm64

      - name: Prépare APK
        run: |
          mkdir -p dist
          cp build_app/build/app/outputs/flutter-apk/app-release.apk \
             dist/NavigationVocale-Thinkphone.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavigationVocale-Thinkphone
          path: dist/NavigationVocale-Thinkphone.apk
          retention-days: 60

      - name: Créer une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Navigation Vocale v2.0.${{ github.run_number }}"
          body: |
            ## Navigation Vocale Mains-Libres — Thinkphone

            ### Télécharger et installer (2 minutes)
            1. Cliquez sur **NavigationVocale-Thinkphone.apk** ci-dessous
            2. Ouvrez le fichier sur votre Thinkphone
            3. Si demandé → "Autoriser cette source"
            4. Installez
            5. Au premier lancement → appuyez sur la bannière orange → activez "Navigation Vocale" dans Accessibilité
            6. Revenez à l'app → parlez !

            ### Commandes (français et anglais)
            | Commande | Résultat |
            |---|---|
            | "Accueil" | Écran d'accueil |
            | "Retour" | Page précédente |
            | "Ouvrir [app]" | Lance une application |
            | "Écrire [texte]" | Tape dans le champ actif |
            | "Envoyer" | Appuie sur Envoyer |
            | "Lis l'écran" | Lit à voix haute l'écran |
            | "Lis mes notifications" | Lit les notifications |
            | "Défiler vers le bas" | Scroll |
            | "Appuie sur [bouton]" | Appuie par nom |
            | "Micro off / on" | Coupe / réactive le micro |
            | *Toute autre commande* | Résolution intelligente automatique |

            > Aucune donnée enregistrée. Tout se traite sur l'appareil.
          files: dist/NavigationVocale-Thinkphone.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
